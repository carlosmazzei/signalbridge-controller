# .github/workflows/build-all.yml
name: "Build All"

on:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - '.gitmodules'
      - 'CMakeLists.txt'
      - '*.cmake'
      - 'CMakePresets.json'
      - '.devcontainer/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rebuild_devcontainer:
        description: 'Rebuild the DevContainer image even if its dependencies did not change'
        type: boolean
        default: false

env:
  PICO_PLATFORM: rp2040
  PICO_BOARD: pico
  PICO_SDK_PATH: ./lib/pico-sdk
  FREERTOS_KERNEL_PATH: ./lib/FreeRTOS-Kernel
  PICO_TOOLCHAIN_PATH: /usr/bin

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      devcontainer-changed: ${{ steps.changes.outputs.devcontainer }}
      firmware-changed: ${{ steps.changes.outputs.firmware }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            # Only the files baked into the image. Other .devcontainer files
            # run from the checkout and reuse the cached image.
            devcontainer:
              - '.devcontainer/Dockerfile'
              - '.devcontainer/dependencies.json'
              - '.devcontainer/resolve-dependencies.jq'
            firmware:
              - '.devcontainer/post-create.sh'
              - '.devcontainer/install_misra_addon.sh'
              - 'src/**'
              - 'include/**'
              - 'test/**'
              - '.gitmodules'
              - 'CMakeLists.txt'
              - '*.cmake'
              - 'CMakePresets.json'

  build-devcontainer:
    name: Build DevContainer
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.devcontainer-changed == 'true' || inputs.rebuild_devcontainer
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.image_tags.outputs.tag_sha }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define tags
        id: image_tags
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/devcontainer-embedded-debian
          echo "tag_latest=${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
          echo "tag_debian12=${IMAGE_NAME}:debian-12" >> $GITHUB_OUTPUT
          echo "tag_sha=${IMAGE_NAME}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push DevContainer image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ${{ steps.image_tags.outputs.tag_latest }}
            ${{ steps.image_tags.outputs.tag_debian12 }}
            ${{ steps.image_tags.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    needs: [detect-changes, build-devcontainer]
    # Runs if firmware changed OR if devcontainer changed OR if it's a release OR workflow_dispatch
    if: |
      always() && 
      (needs.detect-changes.outputs.firmware-changed == 'true' || 
       needs.detect-changes.outputs.devcontainer-changed == 'true' || 
       github.event_name == 'release' || 
       github.event_name == 'workflow_dispatch') &&
      (needs.build-devcontainer.result == 'success' || needs.build-devcontainer.result == 'skipped')
    
    container:
      image: ${{ needs.build-devcontainer.outputs.image-tag || format('ghcr.io/{0}/devcontainer-embedded-debian:latest', github.repository) }}
      options: --user=root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      # Checkout the repository with submodules
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Run workspace setup
        run: |
          chmod +x .devcontainer/post-create.sh
          .devcontainer/post-create.sh

      # Verify toolchain installation
      - name: Verify installed toolchain version
        run: arm-none-eabi-gcc --version

      # Comprehensive debugging of paths and directory structure
      - name: Show directory structure and paths
        run: |
          echo "==================== DEBUGGING PATHS ===================="
          echo "Current working directory: $(pwd)"
          echo ""
          echo "=== Environment Variables ==="
          echo "BUILD_TYPE: $BUILD_TYPE"
          echo "PICO_PLATFORM: $PICO_PLATFORM"
          echo "PICO_BOARD: $PICO_BOARD"
          echo "PICO_SDK_PATH: $PICO_SDK_PATH"
          echo "FREERTOS_KERNEL_PATH: $FREERTOS_KERNEL_PATH"
          echo "PICO_TOOLCHAIN_PATH: $PICO_TOOLCHAIN_PATH"
          echo ""
          echo "=== Root Directory Contents ==="
          ls -la
          echo ""
          echo "=== Lib Directory ==="
          if [ -d "lib" ]; then
            ls -la lib/
          else
            echo "❌ lib directory does not exist"
          fi
          echo ""
          echo "=== Verifying SDK and FreeRTOS paths ==="
          if [ -d "$PICO_SDK_PATH" ]; then
            echo "✅ PICO_SDK_PATH exists: $PICO_SDK_PATH"
            echo "Contents:"
            ls -la "$PICO_SDK_PATH" | head -5
          else
            echo "❌ PICO_SDK_PATH does not exist: $PICO_SDK_PATH"
          fi
          echo ""
          if [ -d "$FREERTOS_KERNEL_PATH" ]; then
            echo "✅ FREERTOS_KERNEL_PATH exists: $FREERTOS_KERNEL_PATH"
            echo "Contents:"
            ls -la "$FREERTOS_KERNEL_PATH" | head -5
          else
            echo "❌ FREERTOS_KERNEL_PATH does not exist: $FREERTOS_KERNEL_PATH"
          fi
          echo ""
          echo "=== CMake files in project ==="
          find . -name "*.cmake" -type f 2>/dev/null | head -10
          echo ""
          echo "=== Looking for FreeRTOS import files ==="
          find . -name "*FreeRTOS*" -name "*.cmake" -type f 2>/dev/null
          echo ""
          echo "=== CMakeLists.txt files ==="
          find . -name "CMakeLists.txt" -type f 2>/dev/null
          echo "=========================================================="

      # Configure project using CMake presets
      - name: Configure CMake
        run: |
          echo "==================== CMAKE CONFIGURATION ===================="
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo ""
          echo "Lib directory:"
          ls -la lib/
          echo ""
          echo "=== Paths relative to project root ==="
          echo "PICO_SDK_PATH: ${{ env.PICO_SDK_PATH }}"
          echo "FREERTOS_KERNEL_PATH: ${{ env.FREERTOS_KERNEL_PATH }}"
          echo ""
          echo "=== Verifying paths exist ==="
          if [ -d "${{ env.PICO_SDK_PATH }}" ]; then
            echo "✅ PICO_SDK_PATH exists: ${{ env.PICO_SDK_PATH }}"
          else
            echo "❌ PICO_SDK_PATH does not exist: ${{ env.PICO_SDK_PATH }}"
          fi
          if [ -d "${{ env.FREERTOS_KERNEL_PATH }}" ]; then
            echo "✅ FREERTOS_KERNEL_PATH exists: ${{ env.FREERTOS_KERNEL_PATH }}"
          else
            echo "❌ FREERTOS_KERNEL_PATH does not exist: ${{ env.FREERTOS_KERNEL_PATH }}"
          fi
          echo ""
          echo "=== Running CMake with preset ==="
          cmake --preset pico-release --debug-output
          echo "=========================================================="

      # Build the project using presets
      - name: Build
        run: |
          echo "==================== BUILDING PROJECT ===================="
          echo "Starting build process..."
          cmake --build --preset pico-release --verbose
          echo ""
          echo "=== Build completed - checking outputs ==="
          find build-release -name "*.uf2" -o -name "*.elf" -o -name "*.bin" -o -name "*.hex" 2>/dev/null
          echo "=========================================================="

      # Publish the full release build directory for downstream analysis jobs
      - name: Upload build-release directory
        uses: actions/upload-artifact@v7
        with:
          name: build-release
          path: build-release
          retention-days: 5

      # Archive documentation if it exists
      - name: Archive Doxygen Documentation
        run: |
          echo "==================== DOCUMENTATION ===================="
          if [ -d "build-release/docs/doc_doxygen" ]; then
            echo "✅ Doxygen documentation found"
            echo "Creating documentation archive..."
            tar -czf build-release/src/doc.tar.gz -C build-release/docs/ doc_doxygen
            echo "Documentation archived successfully"
          else
            echo "ℹ️  Doxygen documentation not found, skipping archive"
            echo "Available directories in build:"
            find build-release -type d -name "*doc*" 2>/dev/null || echo "No documentation directories found"
          fi
          echo "=========================================================="

      # Debug artifacts before upload
      - name: Show artifacts
        run: |
          echo "==================== ARTIFACTS ===================="
          echo "=== Looking for build artifacts ==="
          find build-release -name "*.uf2" -o -name "*.elf" -o -name "*.bin" -o -name "*.hex" 2>/dev/null
          echo ""
          echo "=== Build directory structure ==="
          find build-release -type f | head -20
          echo "=========================================================="

      # Store build artifacts
      - name: Store Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pico-build
          path: |
            build-release/src/*.uf2
            build-release/src/*.elf
            build-release/src/doc.tar.gz
          retention-days: 10

  unit-tests:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: [detect-changes, build-devcontainer, build-firmware]
    if: |
      always() &&
      (needs.detect-changes.outputs.firmware-changed == 'true' ||
       needs.detect-changes.outputs.devcontainer-changed == 'true' ||
       github.event_name == 'release' ||
       github.event_name == 'workflow_dispatch') &&
      (needs.build-devcontainer.result == 'success' || needs.build-devcontainer.result == 'skipped') &&
      needs.build-firmware.result == 'success'
    container:
      image: ${{ needs.build-devcontainer.outputs.image-tag || format('ghcr.io/{0}/devcontainer-embedded-debian:latest', github.repository) }}
      options: --user=root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Quality checks (cppcheck, host tests) report failures but do not fail
    # this job yet. Set the repository variable ENFORCE_QUALITY_GATES=true to
    # turn them into blocking gates for the workflow and the release.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run workspace setup
        run: |
          chmod +x .devcontainer/post-create.sh
          .devcontainer/post-create.sh

      - name: Download build-release directory
        uses: actions/download-artifact@v8
        with:
          name: build-release
          path: build-release

      - name: Restore build-release directory
        run: |
          # Ensure the full release build output (including generated headers) is present for cppcheck analysis
          if [ ! -d build-release ]; then
            echo "❌ build-release directory not found after artifact download"
            exit 1
          fi

          # Ensure the compilation database from the release build is available at the repo root
          if [ ! -f build-release/compile_commands.json ]; then
            echo "❌ compile_commands.json missing from build-release"
            ls -la build-release || true
            exit 1
          fi

          cp build-release/compile_commands.json ./compile_commands.json

          echo "Restored build-release contents:"
          ls -la build-release | head
          echo "compile_commands.json present:"
          ls -l ./compile_commands.json

      - name: Run Cppcheck (MISRA)
        id: run_cppcheck
        continue-on-error: ${{ vars.ENFORCE_QUALITY_GATES != 'true' }}
        run: ./scripts/run_cppcheck.sh

      - name: Configure tests
        id: configure_tests
        continue-on-error: ${{ vars.ENFORCE_QUALITY_GATES != 'true' }}
        run: cmake --preset host-tests

      - name: Build tests
        id: build_tests
        continue-on-error: ${{ vars.ENFORCE_QUALITY_GATES != 'true' }}
        run: cmake --build --preset host-tests

      - name: Run tests
        id: run_tests
        continue-on-error: ${{ vars.ENFORCE_QUALITY_GATES != 'true' }}
        run: ctest --preset host-tests

      - name: Report quality check results
        if: always()
        run: |
          failed=""
          for check in "cppcheck=${{ steps.run_cppcheck.outcome }}" \
                       "configure_tests=${{ steps.configure_tests.outcome }}" \
                       "build_tests=${{ steps.build_tests.outcome }}" \
                       "run_tests=${{ steps.run_tests.outcome }}"; do
            if [ "${check#*=}" = "failure" ]; then
              failed="$failed ${check%%=*}"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::warning title=Quality checks failed::Failed:$failed (not blocking: ENFORCE_QUALITY_GATES is not true)"
            echo "⚠️ Quality checks failed (not blocking):$failed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ All quality checks passed" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Coverage is reporting only; test failures are gated by "Run tests".
      - name: Generate coverage
        continue-on-error: true
        run: cmake --build --preset host-tests-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build-tests/coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build-tests/test/coverage.info
          flags: unittests

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            --define "sonar.cfamily.compile-commands=build-tests/compile_commands.json"
            --define "sonar.coverageReportPaths=build-tests/coverage/sonarqube.xml"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Release job (only runs on releases)
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [detect-changes, unit-tests, build-firmware]
    # Publish only artifacts from a successful build that also passed the
    # quality job (which only fails when ENFORCE_QUALITY_GATES is true).
    if: |
      always() &&
      github.event_name == 'release' && github.event.action == 'published' &&
      needs.build-firmware.result == 'success' &&
      needs.unit-tests.result == 'success'
    
    steps:
      # Download artifacts from build job
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: pico-build
          path: artifacts

      # Debug downloaded artifacts
      - name: Debug - Show downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f
          ls -la artifacts/

      # Upload to GitHub release
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.uf2
            artifacts/**/*.elf
            artifacts/**/*.bin
            artifacts/**/*.hex
            artifacts/doc.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
