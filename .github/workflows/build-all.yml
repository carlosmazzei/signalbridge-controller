name: Build All

on:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'scripts/**'
      - 'lib/**'
      - '.gitmodules'
      - 'CMakeLists.txt'
      - '*.cmake'
      - 'CMakePresets.json'
      - '.devcontainer/**'
      - '.github/workflows/build-all.yml'
      - '.cppcheck*'
      - 'misra.*'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Firmware and quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Build the toolchain from this checkout, including on fork PRs. No
      # registry credentials, mutable :latest image, or skipped job outputs.
      - name: Build toolchain image
        run: docker build --tag signalbridge-ci .devcontainer
      - name: Compile firmware and run static analysis
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:$PWD" --workdir "$PWD" signalbridge-ci \
            bash -euc 'cmake --preset pico-release -DSIGNALBRIDGE_BUILD_DOCS=OFF
              cmake --build --preset pico-release
              ./scripts/run_cppcheck.sh'
      - name: Build and run host tests
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:$PWD" --workdir "$PWD" signalbridge-ci \
            bash -euc 'cmake --preset host-tests
              cmake --build --preset host-tests
              ctest --preset host-tests'
      - name: Address and undefined behavior sanitizers
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:$PWD" --workdir "$PWD" signalbridge-ci \
            bash -euc 'cmake -S . -B build-sanitize -DHOST_BUILD=ON -DBUILD_TESTING=ON -DSIGNALBRIDGE_BUILD_DOCS=OFF -DENABLE_SANITIZERS=ON
              cmake --build build-sanitize -j4
              ASAN_OPTIONS=detect_leaks=0 ctest --test-dir build-sanitize --output-on-failure'
      - name: Store validated firmware
        uses: actions/upload-artifact@v7
        with:
          name: pico-build
          path: |
            build-release/src/*.uf2
            build-release/src/*.elf
          if-no-files-found: error
      - name: Store quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          include-hidden-files: true
          path: |
            build-tests/coverage
            .cppcheck/cppcheck.log
            .cppcheck/checkers_report.txt
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build-tests/test/coverage.info
          flags: unittests
      - name: SonarQube analysis
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            --define "sonar.cfamily.compile-commands=build-tests/compile_commands.json"
            --define "sonar.coverageReportPaths=build-tests/coverage/sonarqube.xml"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    name: Publish validated firmware
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'release' && needs.build-and-test.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pico-build
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.uf2
            artifacts/*.elf
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
